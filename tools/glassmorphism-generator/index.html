<body>
    <div class="container">
        <header>
            <h1>Glassmorphism Generator</h1>
            <p class="subtitle">Create beautiful frosted glass effects with CSS</p>
        </header>

        <div class="content">
            <div class="panel">
                <h2>Effect Controls</h2>

                <div class="preset-buttons">
                    <button class="preset-btn" onclick="applyPreset('soft')">Soft</button>
                    <button class="preset-btn" onclick="applyPreset('medium')">Medium</button>
                    <button class="preset-btn" onclick="applyPreset('dense')">Dense</button>
                    <button class="preset-btn" onclick="applyPreset('vibrant')">Vibrant</button>
                </div>

                <div class="control-group">
                    <label>Blur</label>
                    <div class="slider-group">
                        <input type="range" id="blur" min="0" max="30" value="10" oninput="updatePreview()">
                        <span class="value-display" id="blurValue">10px</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Opacity</label>
                    <div class="slider-group">
                        <input type="range" id="opacity" min="0" max="100" value="20" oninput="updatePreview()">
                        <span class="value-display" id="opacityValue">20%</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Border Opacity</label>
                    <div class="slider-group">
                        <input type="range" id="borderOpacity" min="0" max="100" value="20" oninput="updatePreview()">
                        <span class="value-display" id="borderOpacityValue">20%</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Saturation</label>
                    <div class="slider-group">
                        <input type="range" id="saturation" min="0" max="100" value="100" oninput="updatePreview()">
                        <span class="value-display" id="saturationValue">100%</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Background Color</label>
                    <input type="color" id="bgColor" value="#ffffff" oninput="updatePreview()">
                </div>
            </div>

            <div class="panel">
                <h2>Generated CSS</h2>
                <textarea id="output" readonly></textarea>
                <button class="copy-btn" onclick="copyCode()">📋 Copy Code</button>
            </div>
        </div>

        <div class="preview-section">
            <div class="glass-card" id="preview">
                <h3>Glassmorphism</h3>
                <p>Beautiful frosted glass effect with CSS backdrop filters.</p>
            </div>
        </div>
    </div>

    <footer>
        © 2026 gen8x.com — CSS & Design Tools
    </footer>

    <script>
        const presets = {
            soft: { blur: 5, opacity: 15, borderOpacity: 15, saturation: 80 },
            medium: { blur: 10, opacity: 20, borderOpacity: 20, saturation: 100 },
            dense: { blur: 20, opacity: 30, borderOpacity: 25, saturation: 120 },
            vibrant: { blur: 15, opacity: 25, borderOpacity: 30, saturation: 140 }
        };

        function applyPreset(name) {
            const preset = presets[name];
            document.getElementById('blur').value = preset.blur;
            document.getElementById('opacity').value = preset.opacity;
            document.getElementById('borderOpacity').value = preset.borderOpacity;
            document.getElementById('saturation').value = preset.saturation;
            updatePreview();
        }

        function updatePreview() {
            const blur = document.getElementById('blur').value;
            const opacity = document.getElementById('opacity').value;
            const borderOpacity = document.getElementById('borderOpacity').value;
            const saturation = document.getElementById('saturation').value;
            const bgColor = document.getElementById('bgColor').value;

            document.getElementById('blurValue').textContent = blur + 'px';
            document.getElementById('opacityValue').textContent = opacity + '%';
            document.getElementById('borderOpacityValue').textContent = borderOpacity + '%';
            document.getElementById('saturationValue').textContent = saturation + '%';

            const bgRgb = hexToRgb(bgColor);
            const bgRgba = `rgba(${bgRgb.r}, ${bgRgb.g}, ${bgRgb.b}, ${opacity / 100})`;
            const borderRgba = `rgba(255, 255, 255, ${borderOpacity / 100})`;

            const css = `.glassmorphism {
  background: ${bgRgba};
  backdrop-filter: blur(${blur}px) saturate(${saturation}%);
  -webkit-backdrop-filter: blur(${blur}px) saturate(${saturation}%);
  border: 1px solid ${borderRgba};
  border-radius: 20px;
  padding: 40px;
}`;

            document.getElementById('output').value = css;

            const preview = document.getElementById('preview');
            preview.style.background = bgRgba;
            preview.style.backdropFilter = `blur(${blur}px) saturate(${saturation}%)`;
            preview.style.WebkitBackdropFilter = `blur(${blur}px) saturate(${saturation}%)`;
            preview.style.border = `1px solid ${borderRgba}`;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 255, b: 255 };
        }

        function copyCode() {
            document.getElementById('output').select();
            document.execCommand('copy');
            alert('CSS copied to clipboard!');
        }

        // Initialize
        applyPreset('medium');
    </script>
