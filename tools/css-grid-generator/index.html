<body>
    <div class="container">
        <header>
            <h1>CSS Grid Generator</h1>
            <p class="subtitle">Create responsive grid layouts with visual preview</p>
        </header>

        <div class="main-content">
            <div class="panel">
                <div class="panel-title">Grid Configuration</div>

                <div class="control-group">
                    <label>Columns & Rows</label>
                    <div class="grid-inputs">
                        <input type="number" id="columns" value="3" min="1" max="12" placeholder="Columns">
                        <input type="number" id="rows" value="3" min="1" max="12" placeholder="Rows">
                    </div>
                </div>

                <div class="responsive-controls">
                    <div class="control-group">
                        <label>Column Gap (px)</label>
                        <input type="number" id="colGap" value="10" min="0" max="100">
                    </div>
                    <div class="control-group">
                        <label>Row Gap (px)</label>
                        <input type="number" id="rowGap" value="10" min="0" max="100">
                    </div>
                </div>

                <div class="control-group">
                    <label>Column Width Type</label>
                    <select id="colType">
                        <option value="fr">Fraction (fr)</option>
                        <option value="px">Pixels (px)</option>
                        <option value="%">Percentage (%)</option>
                        <option value="auto">Auto</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Row Height Type</label>
                    <select id="rowType">
                        <option value="auto">Auto</option>
                        <option value="px">Pixels (px)</option>
                        <option value="fr">Fraction (fr)</option>
                    </select>
                </div>

                <div class="button-group">
                    <button onclick="generateGrid()">Update Grid</button>
                    <button class="secondary-btn" onclick="resetGrid()">Reset</button>
                </div>

                <div class="control-group" style="margin-top: 25px;">
                    <label>Preset Templates</label>
                    <div class="presets">
                        <button class="preset-btn secondary-btn" onclick="applyPreset('holygrail')">Holy Grail</button>
                        <button class="preset-btn secondary-btn" onclick="applyPreset('dashboard')">Dashboard</button>
                        <button class="preset-btn secondary-btn" onclick="applyPreset('gallery')">Gallery</button>
                        <button class="preset-btn secondary-btn" onclick="applyPreset('blog')">Blog</button>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Live Preview</div>
                <div class="preview-area" id="previewArea">
                    <div class="grid-preview" id="gridPreview"></div>
                </div>

                <div class="control-group">
                    <button onclick="copyCode()">Copy CSS Code</button>
                </div>

                <div class="code-output" id="codeOutput"></div>
            </div>
        </div>
    </div>

    <script>
        const presets = {
            holygrail: {
                cols: 1,
                rows: 3,
                colGap: 20,
                rowGap: 20,
                colType: 'fr',
                rowType: 'auto'
            },
            dashboard: {
                cols: 4,
                rows: 3,
                colGap: 15,
                rowGap: 15,
                colType: 'fr',
                rowType: 'auto'
            },
            gallery: {
                cols: 4,
                rows: 4,
                colGap: 10,
                rowGap: 10,
                colType: 'fr',
                rowType: 'fr'
            },
            blog: {
                cols: 3,
                rows: 5,
                colGap: 20,
                rowGap: 20,
                colType: 'fr',
                rowType: 'auto'
            }
        };

        function generateGrid() {
            const cols = parseInt(document.getElementById('columns').value);
            const rows = parseInt(document.getElementById('rows').value);
            const colGap = parseInt(document.getElementById('colGap').value);
            const rowGap = parseInt(document.getElementById('rowGap').value);
            const colType = document.getElementById('colType').value;
            const rowType = document.getElementById('rowType').value;

            const colValue = colType === 'fr' ? `repeat(${cols}, 1fr)` :
                           colType === 'px' ? `repeat(${cols}, 150px)` :
                           colType === '%' ? `repeat(${cols}, ${100/cols}%)` : 'repeat(auto-fit, minmax(150px, 1fr))';

            const rowValue = rowType === 'auto' ? `repeat(${rows}, auto)` :
                           rowType === 'px' ? `repeat(${rows}, 100px)` : `repeat(${rows}, 1fr)`;

            const gridPreview = document.getElementById('gridPreview');
            gridPreview.style.setProperty('--cols', colValue);
            gridPreview.style.setProperty('--rows', rowValue);
            gridPreview.style.setProperty('--col-gap', colGap + 'px');
            gridPreview.style.setProperty('--row-gap', rowGap + 'px');

            gridPreview.innerHTML = '';
            for (let i = 1; i <= cols * rows; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.textContent = `Cell ${i}`;
                gridPreview.appendChild(cell);
            }

            updateCodeOutput(cols, rows, colGap, rowGap, colType, rowType);
        }

        function updateCodeOutput(cols, rows, colGap, rowGap, colType, rowType) {
            const colValue = colType === 'fr' ? `repeat(${cols}, 1fr)` :
                           colType === 'px' ? `repeat(${cols}, 150px)` :
                           colType === '%' ? `repeat(${cols}, ${100/cols}%)` : 'repeat(auto-fit, minmax(150px, 1fr))';

            const rowValue = rowType === 'auto' ? `repeat(${rows}, auto)` :
                           rowType === 'px' ? `repeat(${rows}, 100px)` : `repeat(${rows}, 1fr)`;

            const code = `.grid-container {
  display: grid;
  grid-template-columns: ${colValue};
  grid-template-rows: ${rowValue};
  column-gap: ${colGap}px;
  row-gap: ${rowGap}px;
}

.grid-item {
  background-color: #333;
  padding: 20px;
  border: 1px solid #555;
  border-radius: 4px;
}`;

            document.getElementById('codeOutput').textContent = code;
        }

        function resetGrid() {
            document.getElementById('columns').value = 3;
            document.getElementById('rows').value = 3;
            document.getElementById('colGap').value = 10;
            document.getElementById('rowGap').value = 10;
            document.getElementById('colType').value = 'fr';
            document.getElementById('rowType').value = 'auto';
            generateGrid();
        }

        function applyPreset(presetName) {
            const preset = presets[presetName];
            document.getElementById('columns').value = preset.cols;
            document.getElementById('rows').value = preset.rows;
            document.getElementById('colGap').value = preset.colGap;
            document.getElementById('rowGap').value = preset.rowGap;
            document.getElementById('colType').value = preset.colType;
            document.getElementById('rowType').value = preset.rowType;
            generateGrid();
        }

        function copyCode() {
            const code = document.getElementById('codeOutput').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        // Initialize
        generateGrid();

        // Add event listeners
        document.getElementById('columns').addEventListener('change', generateGrid);
        document.getElementById('rows').addEventListener('change', generateGrid);
        document.getElementById('colGap').addEventListener('input', generateGrid);
        document.getElementById('rowGap').addEventListener('input', generateGrid);
        document.getElementById('colType').addEventListener('change', generateGrid);
        document.getElementById('rowType').addEventListener('change', generateGrid);
    </script>
