<body>
    <div class="container">
        <header>
            <h1>CSS Filter Playground</h1>
            <p class="subtitle">Explore CSS filter effects with interactive visual controls</p>
        </header>

        <div class="content">
            <div class="panel">
                <h2>Filter Controls</h2>

                <div class="preset-buttons">
                    <button class="preset-btn" onclick="applyPreset('sepia')">Sepia</button>
                    <button class="preset-btn" onclick="applyPreset('noir')">Noir</button>
                    <button class="preset-btn" onclick="applyPreset('sunny')">Sunny</button>
                    <button class="preset-btn" onclick="applyPreset('cool')">Cool</button>
                </div>

                <div class="controls-group">
                    <div class="control-item">
                        <label>Blur</label>
                        <div class="slider-wrapper">
                            <input type="range" id="blur" min="0" max="20" value="0" oninput="updateFilter()">
                            <span class="value-badge" id="blurVal">0px</span>
                        </div>
                    </div>

                    <div class="control-item">
                        <label>Brightness</label>
                        <div class="slider-wrapper">
                            <input type="range" id="brightness" min="0" max="200" value="100" oninput="updateFilter()">
                            <span class="value-badge" id="brightnessVal">100%</span>
                        </div>
                    </div>

                    <div class="control-item">
                        <label>Contrast</label>
                        <div class="slider-wrapper">
                            <input type="range" id="contrast" min="0" max="200" value="100" oninput="updateFilter()">
                            <span class="value-badge" id="contrastVal">100%</span>
                        </div>
                    </div>

                    <div class="control-item">
                        <label>Grayscale</label>
                        <div class="slider-wrapper">
                            <input type="range" id="grayscale" min="0" max="100" value="0" oninput="updateFilter()">
                            <span class="value-badge" id="grayscaleVal">0%</span>
                        </div>
                    </div>

                    <div class="control-item">
                        <label>Hue Rotate</label>
                        <div class="slider-wrapper">
                            <input type="range" id="hueRotate" min="0" max="360" value="0" oninput="updateFilter()">
                            <span class="value-badge" id="hueRotateVal">0°</span>
                        </div>
                    </div>

                    <div class="control-item">
                        <label>Invert</label>
                        <div class="slider-wrapper">
                            <input type="range" id="invert" min="0" max="100" value="0" oninput="updateFilter()">
                            <span class="value-badge" id="invertVal">0%</span>
                        </div>
                    </div>

                    <div class="control-item">
                        <label>Opacity</label>
                        <div class="slider-wrapper">
                            <input type="range" id="opacity" min="0" max="100" value="100" oninput="updateFilter()">
                            <span class="value-badge" id="opacityVal">100%</span>
                        </div>
                    </div>

                    <div class="control-item">
                        <label>Saturate</label>
                        <div class="slider-wrapper">
                            <input type="range" id="saturate" min="0" max="200" value="100" oninput="updateFilter()">
                            <span class="value-badge" id="saturateVal">100%</span>
                        </div>
                    </div>

                    <div class="control-item">
                        <label>Sepia</label>
                        <div class="slider-wrapper">
                            <input type="range" id="sepia" min="0" max="100" value="0" oninput="updateFilter()">
                            <span class="value-badge" id="sepiaVal">0%</span>
                        </div>
                    </div>

                    <button class="reset-btn" onclick="resetFilters()">Reset All</button>
                </div>
            </div>

            <div class="panel">
                <h2>Generated CSS</h2>
                <textarea id="output" readonly></textarea>
                <button class="copy-btn" onclick="copyCode()">📋 Copy Code</button>
            </div>
        </div>

        <div class="preview-panel">
            <h2>Live Preview</h2>
            <div class="preview-image" id="preview">Filter Preview</div>
        </div>
    </div>

    <footer>
        © 2026 gen8x.com — CSS & Design Tools
    </footer>

    <script>
        const presets = {
            sepia: {
                blur: 0,
                brightness: 110,
                contrast: 110,
                grayscale: 0,
                hueRotate: 40,
                invert: 0,
                opacity: 100,
                saturate: 80,
                sepia: 60
            },
            noir: {
                blur: 0,
                brightness: 80,
                contrast: 130,
                grayscale: 100,
                hueRotate: 0,
                invert: 0,
                opacity: 100,
                saturate: 0,
                sepia: 0
            },
            sunny: {
                blur: 0,
                brightness: 130,
                contrast: 90,
                grayscale: 0,
                hueRotate: -10,
                invert: 0,
                opacity: 100,
                saturate: 150,
                sepia: 20
            },
            cool: {
                blur: 0,
                brightness: 100,
                contrast: 110,
                grayscale: 0,
                hueRotate: 200,
                invert: 0,
                opacity: 100,
                saturate: 120,
                sepia: 0
            }
        };

        function applyPreset(name) {
            const preset = presets[name];
            document.getElementById('blur').value = preset.blur;
            document.getElementById('brightness').value = preset.brightness;
            document.getElementById('contrast').value = preset.contrast;
            document.getElementById('grayscale').value = preset.grayscale;
            document.getElementById('hueRotate').value = preset.hueRotate;
            document.getElementById('invert').value = preset.invert;
            document.getElementById('opacity').value = preset.opacity;
            document.getElementById('saturate').value = preset.saturate;
            document.getElementById('sepia').value = preset.sepia;
            updateFilter();
        }

        function updateFilter() {
            const blur = parseInt(document.getElementById('blur').value);
            const brightness = parseInt(document.getElementById('brightness').value);
            const contrast = parseInt(document.getElementById('contrast').value);
            const grayscale = parseInt(document.getElementById('grayscale').value);
            const hueRotate = parseInt(document.getElementById('hueRotate').value);
            const invert = parseInt(document.getElementById('invert').value);
            const opacity = parseInt(document.getElementById('opacity').value);
            const saturate = parseInt(document.getElementById('saturate').value);
            const sepia = parseInt(document.getElementById('sepia').value);

            document.getElementById('blurVal').textContent = blur + 'px';
            document.getElementById('brightnessVal').textContent = brightness + '%';
            document.getElementById('contrastVal').textContent = contrast + '%';
            document.getElementById('grayscaleVal').textContent = grayscale + '%';
            document.getElementById('hueRotateVal').textContent = hueRotate + '°';
            document.getElementById('invertVal').textContent = invert + '%';
            document.getElementById('opacityVal').textContent = opacity + '%';
            document.getElementById('saturateVal').textContent = saturate + '%';
            document.getElementById('sepiaVal').textContent = sepia + '%';

            const filterValue = `blur(${blur}px) brightness(${brightness}%) contrast(${contrast}%) grayscale(${grayscale}%) hue-rotate(${hueRotate}deg) invert(${invert}%) opacity(${opacity}%) saturate(${saturate}%) sepia(${sepia}%)`;

            const css = `filter: ${filterValue};`;

            document.getElementById('output').value = css;
            document.getElementById('preview').style.filter = filterValue;
        }

        function resetFilters() {
            document.getElementById('blur').value = 0;
            document.getElementById('brightness').value = 100;
            document.getElementById('contrast').value = 100;
            document.getElementById('grayscale').value = 0;
            document.getElementById('hueRotate').value = 0;
            document.getElementById('invert').value = 0;
            document.getElementById('opacity').value = 100;
            document.getElementById('saturate').value = 100;
            document.getElementById('sepia').value = 0;
            updateFilter();
        }

        function copyCode() {
            document.getElementById('output').select();
            document.execCommand('copy');
            alert('CSS copied to clipboard!');
        }

        // Initialize
        updateFilter();
    </script>
</body>
</html>
