<!DOCTYPE html>
<html lang="en">
<head>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Color Palette Generator",
        "description": "Generate harmonious, accessible color palettes with WCAG contrast analysis",

    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
            border-bottom: 1px solid #222;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .subtitle {
            font-size: 1rem;
            color: #999;

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;

        .panel {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;

        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ddd;
        }

        input[type="color"],
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            background-color: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.95rem;
        }

        input[type="color"] {
            height: 50px;
            cursor: pointer;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }

        button {
            padding: 10px 16px;
            background-color: #00d4ff;
            color: #0a0a0a;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #00b8d4;
            transform: translateY(-2px);
        }

        .palette-preview {
            background-color: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .color-swatch {
            aspect-ratio: 1;
            border-radius: 4px;
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 5px;
            font-size: 0.7rem;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .color-swatch:hover {
            transform: scale(1.05);
        }

        .palette-strip {
            display: flex;
            height: 40px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .strip-color {
            flex: 1;
        }

        .colors-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .colors-table th {
            background-color: #0a0a0a;
            color: #00d4ff;
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #333;
        }

        .colors-table td {
            padding: 10px;
            border-bottom: 1px solid #333;
        }

        .color-sample {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            border: 1px solid #555;
        }

        .contrast-badge {
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .contrast-aa {
            background-color: #28a745;
            color: white;
        }

        .contrast-aaa {
            background-color: #20c997;
            color: white;
        }

        .contrast-fail {
            background-color: #dc3545;
            color: white;
        }

        .section-title {
            font-size: 1rem;
            color: #00d4ff;
            margin-top: 25px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .button-group button {
            width: 100%;
            margin: 0;
        }

        .secondary-btn {
            background-color: #333;
            color: #fff;
        }

        .secondary-btn:hover {
            background-color: #444;
        }

        .copy-btn {
            font-size: 0.8rem;
        }

        .color-blindness {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .colorblind-preview {
            background-color: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
        }

        .colorblind-preview-title {
            font-size: 0.85rem;
            color: #00d4ff;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .colorblind-strip {
            display: flex;
            height: 30px;
            border-radius: 3px;
            overflow: hidden;
        }

        .colorblind-color {
            flex: 1;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #222;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .color-blindness {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Color Palette Generator</h1>
            <p class="subtitle">Create accessible, harmonious color schemes</p>
        </header>

        <div class="main-content">
            <div class="panel" style="max-height: fit-content;">
                <div class="panel-title">Settings</div>

                <div class="control-group">
                    <label>Base Color</label>
                    <input type="color" id="baseColor" value="#3b82f6">
                </div>

                <div class="control-group">
                    <label>Harmony Type</label>
                    <select id="harmonyType">
                        <option value="complementary">Complementary</option>
                        <option value="analogous">Analogous</option>
                        <option value="triadic">Triadic</option>
                        <option value="tetradic">Tetradic</option>
                        <option value="split">Split-Complementary</option>
                        <option value="monochromatic">Monochromatic</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Saturation (+/-)</label>
                    <input type="number" id="saturation" value="0" min="-50" max="50">
                </div>

                <div class="control-group">
                    <label>Lightness (+/-)</label>
                    <input type="number" id="lightness" value="0" min="-50" max="50">
                </div>

                <button onclick="generatePalette()">Generate Palette</button>
                <button class="secondary-btn" onclick="randomPalette()">Random</button>
            </div>

            <div class="panel">
                <div class="panel-title">Palette Preview</div>

                <div class="palette-strip" id="paletteStrip"></div>

                <div class="palette-preview" id="palettePreview"></div>

                <div class="section-title">Color Values</div>
                <table class="colors-table" id="colorsTable">
                    <thead>
                        <tr>
                            <th>Color</th>
                            <th>Hex</th>
                            <th>RGB</th>
                            <th>HSL</th>
                        </tr>
                    </thead>
                    <tbody id="colorRows"></tbody>
                </table>

                <div class="section-title">WCAG Contrast</div>
                <div id="contrastResults" style="font-size: 0.9rem;">
                    <p>Generate palette to see contrast ratios</p>
                </div>

                <div class="section-title">Color Blindness Simulation</div>
                <div class="color-blindness" id="colorBlindness"></div>

                <button class="secondary-btn copy-btn" onclick="copyAsCSS()">Copy as CSS Variables</button>
                <button class="secondary-btn copy-btn" onclick="copyAsScss()">Copy as SCSS</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 gen8x.com
    </footer>

    <script>
        function hexToHsl(hex) {
            const r = parseInt(hex.slice(1, 3), 16) / 255;
            const g = parseInt(hex.slice(3, 5), 16) / 255;
            const b = parseInt(hex.slice(5, 7), 16) / 255;

            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }

            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }

        function hslToHex(h, s, l) {
            s /= 100;
            l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        function generateHarmony(baseHex, type) {
            const hsl = hexToHsl(baseHex);
            const colors = [hsl];

            switch (type) {
                case 'complementary':
                    colors.push({ h: (hsl.h + 180) % 360, s: hsl.s, l: hsl.l });
                    colors.push({ h: (hsl.h + 90) % 360, s: hsl.s, l: hsl.l });
                    break;
                case 'analogous':
                    colors.push({ h: (hsl.h + 30) % 360, s: hsl.s, l: hsl.l });
                    colors.push({ h: (hsl.h - 30 + 360) % 360, s: hsl.s, l: hsl.l });
                    break;
                case 'triadic':
                    colors.push({ h: (hsl.h + 120) % 360, s: hsl.s, l: hsl.l });
                    colors.push({ h: (hsl.h + 240) % 360, s: hsl.s, l: hsl.l });
                    break;
                case 'tetradic':
                    colors.push({ h: (hsl.h + 90) % 360, s: hsl.s, l: hsl.l });
                    colors.push({ h: (hsl.h + 180) % 360, s: hsl.s, l: hsl.l });
                    colors.push({ h: (hsl.h + 270) % 360, s: hsl.s, l: hsl.l });
                    break;
                case 'split':
                    colors.push({ h: (hsl.h + 150) % 360, s: hsl.s, l: hsl.l });
                    colors.push({ h: (hsl.h + 210) % 360, s: hsl.s, l: hsl.l });
                    break;
                case 'monochromatic':
                    colors.push({ h: hsl.h, s: hsl.s, l: Math.min(100, hsl.l + 20) });
                    colors.push({ h: hsl.h, s: hsl.s, l: Math.max(0, hsl.l - 20) });
                    colors.push({ h: hsl.h, s: hsl.s, l: Math.min(100, hsl.l + 40) });
                    break;
            }

            return colors.slice(0, 5);
        }

        function applyAdjustments(colors, saturation, lightness) {
            return colors.map(c => ({
                h: c.h,
                s: Math.max(0, Math.min(100, c.s + saturation)),
                l: Math.max(0, Math.min(100, c.l + lightness))
            }));
        }

        function getContrastRatio(hex1, hex2) {
            const rgb1 = hexToRgb(hex1);
            const rgb2 = hexToRgb(hex2);

            const getLum = (r, g, b) => {
                const [rs, gs, bs] = [r, g, b].map(x => {
                    x = x / 255;
                    return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
                });
                return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
            };

            const lum1 = getLum(rgb1.r, rgb1.g, rgb1.b);
            const lum2 = getLum(rgb2.r, rgb2.g, rgb2.b);
            const lighter = Math.max(lum1, lum2);
            const darker = Math.min(lum1, lum2);

            return ((lighter + 0.05) / (darker + 0.05)).toFixed(2);
        }

        function generatePalette() {
            const baseColor = document.getElementById('baseColor').value;
            const harmonyType = document.getElementById('harmonyType').value;
            const saturation = parseInt(document.getElementById('saturation').value);
            const lightness = parseInt(document.getElementById('lightness').value);

            let colors = generateHarmony(baseColor, harmonyType);
            colors = applyAdjustments(colors, saturation, lightness);

            const hexColors = colors.map(c => hslToHex(c.h, c.s, c.l));

            // Update preview
            const preview = document.getElementById('palettePreview');
            preview.innerHTML = '';
            hexColors.forEach((hex, i) => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = hex;
                swatch.textContent = hex;
                swatch.onclick = () => {
                    navigator.clipboard.writeText(hex);
                };
                preview.appendChild(swatch);
            });

            // Update strip
            const strip = document.getElementById('paletteStrip');
            strip.innerHTML = '';
            hexColors.forEach(hex => {
                const color = document.createElement('div');
                color.className = 'strip-color';
                color.style.backgroundColor = hex;
                strip.appendChild(color);
            });

            // Update table
            const colorRows = document.getElementById('colorRows');
            colorRows.innerHTML = '';
            hexColors.forEach((hex, i) => {
                const hsl = hexToHsl(hex);
                const rgb = hexToRgb(hex);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><div class="color-sample" style="background-color: ${hex}"></div></td>
                    <td>${hex}</td>
                    <td>rgb(${rgb.r}, ${rgb.g}, ${rgb.b})</td>
                    <td>hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)</td>
                `;
                colorRows.appendChild(row);
            });

            // Update contrast
            updateContrast(hexColors);

            // Update color blindness
            updateColorBlindness(hexColors);
        }

        function updateContrast(colors) {
            let html = '<p style="margin-bottom: 15px;">WCAG 2.1 Contrast Ratios:</p>';
            for (let i = 0; i < colors.length; i++) {
                for (let j = i + 1; j < colors.length; j++) {
                    const ratio = getContrastRatio(colors[i], colors[j]);
                    let badge = 'contrast-fail';
                    if (ratio >= 7) badge = 'contrast-aaa';
                    else if (ratio >= 4.5) badge = 'contrast-aa';

                    html += `<div style="margin-bottom: 8px;">${colors[i]} + ${colors[j]}: <span class="contrast-badge ${badge}">${ratio}:1</span></div>`;
                }
            }
            document.getElementById('contrastResults').innerHTML = html;
        }

        function updateColorBlindness(colors) {
            const blindness = document.getElementById('colorBlindness');
            blindness.innerHTML = '';

            const types = [
                { name: 'Protanopia', matrix: [[0.567, 0.433, 0], [0.558, 0.442, 0], [0, 0.242, 0.758]] },
                { name: 'Deuteranopia', matrix: [[0.625, 0.375, 0], [0.7, 0.3, 0], [0, 0.3, 0.7]] },
                { name: 'Tritanopia', matrix: [[0.95, 0.05, 0], [0, 0.433, 0.567], [0, 0.475, 0.525]] }
            ];

            types.forEach(type => {
                const preview = document.createElement('div');
                preview.className = 'colorblind-preview';
                preview.innerHTML = `<div class="colorblind-preview-title">${type.name}</div>`;

                const strip = document.createElement('div');
                strip.className = 'colorblind-strip';

                colors.forEach(hex => {
                    const rgb = hexToRgb(hex);
                    const r = rgb.r / 255;
                    const g = rgb.g / 255;
                    const b = rgb.b / 255;

                    const nr = Math.round((type.matrix[0][0] * r + type.matrix[0][1] * g + type.matrix[0][2] * b) * 255);
                    const ng = Math.round((type.matrix[1][0] * r + type.matrix[1][1] * g + type.matrix[1][2] * b) * 255);
                    const nb = Math.round((type.matrix[2][0] * r + type.matrix[2][1] * g + type.matrix[2][2] * b) * 255);

                    const color = document.createElement('div');
                    color.className = 'colorblind-color';
                    color.style.backgroundColor = rgbToHex(nr, ng, nb);
                    strip.appendChild(color);
                });

                preview.appendChild(strip);
                blindness.appendChild(preview);
            });
        }

        function randomPalette() {
            const randomHex = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
            document.getElementById('baseColor').value = randomHex;
            generatePalette();
        }

        function copyAsCSS() {
            const rows = document.querySelectorAll('#colorRows tr');
            let css = ':root {\n';
            rows.forEach((row, i) => {
                const hex = row.cells[1].textContent;
                css += `  --color-${i + 1}: ${hex};\n`;
            });
            css += '}';
            navigator.clipboard.writeText(css);
            alert('Copied as CSS variables!');
        }

        function copyAsScss() {
            const rows = document.querySelectorAll('#colorRows tr');
            let scss = '';
            rows.forEach((row, i) => {
                const hex = row.cells[1].textContent;
                scss += `$color-${i + 1}: ${hex};\n`;
            });
            navigator.clipboard.writeText(scss);
            alert('Copied as SCSS variables!');
        }

        // Initialize
        document.getElementById('baseColor').addEventListener('input', generatePalette);
        document.getElementById('harmonyType').addEventListener('change', generatePalette);
        document.getElementById('saturation').addEventListener('input', generatePalette);
        document.getElementById('lightness').addEventListener('input', generatePalette);

        generatePalette();
    </script>
</body>
</html>
