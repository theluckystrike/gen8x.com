<script>
  (function() {
    // ----- state -----
    let layers = []; // array of layer objects
    const MAX_LAYERS = 5;

    // DOM refs
    const container = document.getElementById('layersContainer');
    const previewCard = document.getElementById('previewCard');
    const cssCode = document.getElementById('cssCode');
    const copyBtn = document.getElementById('copyBtn');
    const addBtn = document.getElementById('addLayerBtn');

    // ----- default layer factory -----
    function createLayerData(overrides = {}) {
      return {
        hOffset: 0,
        vOffset: 0,
        blur: 10,
        spread: 0,
        color: '#000000',
        opacity: 0.5,
        inset: false,
        ...overrides
      };
    }

    // ----- init with 2 default layers (material-like) -----
    function initLayers() {
      layers = [
        createLayerData({ hOffset: 0, vOffset: 4, blur: 12, spread: 0, color: '#000000', opacity: 0.15, inset: false }),
        createLayerData({ hOffset: 0, vOffset: 2, blur: 4, spread: 0, color: '#000000', opacity: 0.1, inset: false })
      ];
    }
    initLayers();

    // ----- render all layers -----
    function render() {
      let html = '';
      layers.forEach((layer, idx) => {
        const hue = layer.color;
        const opacityPercent = Math.round(layer.opacity * 100);
        const insetChecked = layer.inset ? 'checked' : '';
        html += `
          <div class="layer-card" data-index="${idx}">
            <div class="layer-header">
              <span class="layer-label">Layer ${idx+1} <span class="layer-count-badge">${idx+1}/${MAX_LAYERS}</span></span>
              <div class="layer-actions">
                ${layers.length > 1 ? `<button class="remove-layer" data-index="${idx}">✕</button>` : ''}
              </div>
            </div>
            <div class="slider-group">
              <label>H-offset</label>
              <input type="range" min="-50" max="50" value="${layer.hOffset}" class="layer-slider" data-prop="hOffset" data-index="${idx}">
              <span class="slider-value">${layer.hOffset}px</span>
            </div>
            <div class="slider-group">
              <label>V-offset</label>
              <input type="range" min="-50" max="50" value="${layer.vOffset}" class="layer-slider" data-prop="vOffset" data-index="${idx}">
              <span class="slider-value">${layer.vOffset}px</span>
            </div>
            <div class="slider-group">
              <label>Blur</label>
              <input type="range" min="0" max="100" value="${layer.blur}" class="layer-slider" data-prop="blur" data-index="${idx}">
              <span class="slider-value">${layer.blur}px</span>
            </div>
            <div class="slider-group">
              <label>Spread</label>
              <input type="range" min="-50" max="50" value="${layer.spread}" class="layer-slider" data-prop="spread" data-index="${idx}">
              <span class="slider-value">${layer.spread}px</span>
            </div>
            <div class="color-inset-row">
              <div class="color-picker-wrap">
                <label>Color</label>
                <input type="color" value="${layer.color}" class="layer-color" data-index="${idx}">
              </div>
              <div class="opacity-slider">
                <label>Opacity</label>
                <input type="range" min="0" max="1" step="0.01" value="${layer.opacity}" class="layer-opacity" data-index="${idx}">
                <span class="slider-value" style="min-width:35px;">${opacityPercent}%</span>
              </div>
              <div class="inset-toggle">
                <label>Inset</label>
                <input type="checkbox" ${insetChecked} class="layer-inset" data-index="${idx}">
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;

      // update add button
      addBtn.disabled = layers.length >= MAX_LAYERS;
      addBtn.textContent = layers.length >= MAX_LAYERS ? 'Max 5 layers' : '+ Add layer';

      // attach events (delegation not used for simplicity, but we attach per element)
      document.querySelectorAll('.remove-layer').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const idx = parseInt(this.dataset.index);
          removeLayer(idx);
        });
      });

      document.querySelectorAll('.layer-slider').forEach(slider => {
        slider.addEventListener('input', function(e) {
          const idx = parseInt(this.dataset.index);
          const prop = this.dataset.prop;
          const val = parseFloat(this.value);
          layers[idx][prop] = val;
          // update display
          const parent = this.closest('.slider-group');
          parent.querySelector('.slider-value').textContent = val + 'px';
          updatePreviewAndCSS();
        });
      });

      document.querySelectorAll('.layer-color').forEach(picker => {
        picker.addEventListener('input', function(e) {
          const idx = parseInt(this.dataset.index);
          layers[idx].color = this.value;
          updatePreviewAndCSS();
        });
      });

      document.querySelectorAll('.layer-opacity').forEach(slider => {
        slider.addEventListener('input', function(e) {
          const idx = parseInt(this.dataset.index);
          const val = parseFloat(this.value);
          layers[idx].opacity = val;
          const percent = Math.round(val * 100);
          const parent = this.closest('.opacity-slider');
          parent.querySelector('.slider-value').textContent = percent + '%';
          updatePreviewAndCSS();
        });
      });

      document.querySelectorAll('.layer-inset').forEach(chk => {
        chk.addEventListener('change', function(e) {
          const idx = parseInt(this.dataset.index);
          layers[idx].inset = this.checked;
          updatePreviewAndCSS();
        });
      });

      updatePreviewAndCSS();
    }

    // ----- remove layer -----
    function removeLayer(idx) {
      if (layers.length <= 1) return;
      layers.splice(idx, 1);
      render();
    }

    // ----- add layer -----
    function addLayer() {
      if (layers.length >= MAX_LAYERS) return;
      layers.push(createLayerData({ hOffset: 0, vOffset: 0, blur: 6, spread: 0, color: '#000000', opacity: 0.2, inset: false }));
      render();
    }

    // ----- compute shadow css string -----
    function computeShadowCSS() {
      if (layers.length === 0) return 'none';
      const parts = layers.map(l => {
        const r = Math.round(l.opacity * 255);
        const hexOpacity = r.toString(16).padStart(2, '0');
        const colorWithOpacity = l.color + hexOpacity;
        const insetStr = l.inset ? 'inset ' : '';
        return `${insetStr}${l.hOffset}px ${l.vOffset}px ${l.blur}px ${l.spread}px ${colorWithOpacity}`;
      });
      return parts.join(', ');
    }

    // ----- update preview + code -----
    function updatePreviewAndCSS() {
      const shadow = computeShadowCSS();
      previewCard.style.boxShadow = shadow;
      cssCode.textContent = `box-shadow: ${shadow};`;
    }

    // ----- presets -----
    function applyPreset(name) {
      let newLayers = [];
      switch(name) {
        case 'material':
          newLayers = [
            createLayerData({ hOffset: 0, vOffset: 4, blur: 12, spread: 0, color: '#000000', opacity: 0.15, inset: false }),
            createLayerData({ hOffset: 0, vOffset: 2, blur: 4, spread: 0, color: '#000000', opacity: 0.1, inset: false })
          ];
          break;
        case 'neumorphism':
          newLayers = [
            createLayerData({ hOffset: 8, vOffset: 8, blur: 16, spread: 0, color: '#a3b1c6', opacity: 0.3, inset: false }),
            createLayerData({ hOffset: -8, vOffset: -8, blur: 16, spread: 0, color: '#ffffff', opacity: 0.2, inset: false })
          ];
          break;
        case 'sharp':
          newLayers = [
            createLayerData({ hOffset: 6, vOffset: 6, blur: 0, spread: 0, color: '#000000', opacity: 0.3, inset: false })
          ];
          break;
        case 'layered':
          newLayers = [
            createLayerData({ hOffset: 0, vOffset: 1, blur: 3, spread: 0, color: '#000000', opacity: 0.12, inset: false }),
            createLayerData({ hOffset: 0, vOffset: 4, blur: 8, spread: 0, color: '#000000', opacity: 0.10, inset: false }),
            createLayerData({ hOffset: 0, vOffset: 10, blur: 20, spread: 0, color: '#000000', opacity: 0.08, inset: false })
          ];
          break;
        case 'neon':
          newLayers = [
            createLayerData({ hOffset: 0, vOffset: 0, blur: 8, spread: 2, color: '#38bdf8', opacity: 0.8, inset: false }),
            createLayerData({ hOffset: 0, vOffset: 0, blur: 20, spread: 4, color: '#38bdf8', opacity: 0.4, inset: false }),
            createLayerData({ hOffset: 0, vOffset: 0, blur: 40, spread: 8, color: '#38bdf8', opacity: 0.2, inset: false })
          ];
          break;
        default: return;
      }
      layers = newLayers;
      render();
    }

    // ----- event listeners -----
    addBtn.addEventListener('click', addLayer);

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        const preset = this.dataset.preset;
        applyPreset(preset);
      });
    });

    // copy button
    copyBtn.addEventListener('click', function() {
      const code = cssCode.textContent;
      navigator.clipboard.writeText(code).then(() => {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy CSS';
          copyBtn.classList.remove('copied');
        }, 1800);
      }).catch(() => {
        // fallback
        const textarea = document.createElement('textarea');
        textarea.value = code;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy CSS'; }, 1500);
      });
    });

    // initial render
    render();
  })();
</script>
