<script>
  (function() {
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const canvas = document.getElementById('svgCanvas');
    const mainPath = document.getElementById('mainPath');
    const pathDisplay = document.getElementById('pathDDisplay');

    // UI elements
    const cmdSelect = document.getElementById('cmdType');
    const strokeColorInput = document.getElementById('strokeColor');
    const strokeWidthInput = document.getElementById('strokeWidth');
    const fillColorInput = document.getElementById('fillColor');

    // State
    let points = [];          // [{x, y, cmd, cp1x, cp1y, cp2x, cp2y, rx, ry, xAxisRot, largeArc, sweep}]
    let history = [];
    let historyIndex = -1;
    const MAX_HISTORY = 40;

    // Refs for control handles (SVG elements)
    let controlElements = [];

    // --- helpers ---
    function getCanvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = 600 / rect.width;
      const scaleY = 400 / rect.height;
      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
        e.preventDefault();
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;
      return { x: Math.min(590, Math.max(10, x)), y: Math.min(390, Math.max(10, y)) };
    }

    // build d string from points
    function buildD() {
      if (!points.length) return '';
      let parts = [];
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const cmd = p.cmd || 'L';
        if (cmd === 'Z') {
          parts.push('Z');
          continue;
        }
        if (cmd === 'M' || cmd === 'L') {
          parts.push(`${cmd} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`);
        } else if (cmd === 'C') {
          const cp1x = p.cp1x ?? p.x; const cp1y = p.cp1y ?? p.y;
          const cp2x = p.cp2x ?? p.x; const cp2y = p.cp2y ?? p.y;
          parts.push(`C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)} ${cp2x.toFixed(1)} ${cp2y.toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`);
        } else if (cmd === 'Q') {
          const cpx = p.cp1x ?? p.x; const cpy = p.cp1y ?? p.y;
          parts.push(`Q ${cpx.toFixed(1)} ${cpy.toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`);
        } else if (cmd === 'A') {
          const rx = p.rx ?? 30; const ry = p.ry ?? 20;
          const rot = p.xAxisRot ?? 0; const la = p.largeArc ?? 0; const sw = p.sweep ?? 1;
          parts.push(`A ${rx.toFixed(1)} ${ry.toFixed(1)} ${rot} ${la} ${sw} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`);
        }
      }
      return parts.join(' ');
    }

    function updatePath() {
      const d = buildD();
      mainPath.setAttribute('d', d || '');
      pathDisplay.textContent = d || '(click canvas to add points)';
      // update stroke/fill
      mainPath.setAttribute('stroke', strokeColorInput.value);
      mainPath.setAttribute('stroke-width', strokeWidthInput.value);
      mainPath.setAttribute('fill', fillColorInput.value);
      drawControlPoints();
    }

    function drawControlPoints() {
      // remove old controls
      controlElements.forEach(el => el.remove());
      controlElements = [];

      if (!points.length) return;

      // draw point circles and handles for last point (or all)
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const cmd = p.cmd || 'L';
        if (cmd === 'Z') continue;

        // main point
        const circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('cx', p.x);
        circle.setAttribute('cy', p.y);
        circle.setAttribute('r', 5);
        circle.setAttribute('fill', '#38bdf8');
        circle.setAttribute('stroke', '#0f172a');
        circle.setAttribute('stroke-width', '1.5');
        circle.dataset.index = i;
        circle.style.cursor = 'grab';
        controlElements.push(circle);
        canvas.appendChild(circle);

        // control handles for C, Q
        if (cmd === 'C') {
          const cp1x = p.cp1x ?? p.x; const cp1y = p.cp1y ?? p.y;
          const cp2x = p.cp2x ?? p.x; const cp2y = p.cp2y ?? p.y;
          addHandle(cp1x, cp1y, i, 'cp1');
          addHandle(cp2x, cp2y, i, 'cp2');
          // lines
          addLine(p.x, p.y, cp1x, cp1y);
          addLine(p.x, p.y, cp2x, cp2y);
        } else if (cmd === 'Q') {
          const cpx = p.cp1x ?? p.x; const cpy = p.cp1y ?? p.y;
          addHandle(cpx, cpy, i, 'cp1');
          addLine(p.x, p.y, cpx, cpy);
        }
      }
    }

    function addHandle(cx, cy, index, type) {
      const g = document.createElementNS(SVG_NS, 'g');
      g.dataset.index = index;
      g.dataset.handle = type;
      const circle = document.createElementNS(SVG_NS, 'circle');
      circle.setAttribute('cx', cx);
      circle.setAttribute('cy', cy);
      circle.setAttribute('r', 6);
      circle.setAttribute('fill', '#fbbf24');
      circle.setAttribute('stroke', '#0f172a');
      circle.setAttribute('stroke-width', '1.5');
      circle.style.cursor = 'pointer';
      g.appendChild(circle);
      controlElements.push(g);
      canvas.appendChild(g);
    }

    function addLine(x1, y1, x2, y2) {
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', '#facc15');
      line.setAttribute('stroke-width', '1');
      line.setAttribute('stroke-dasharray', '3 3');
      controlElements.push(line);
      canvas.appendChild(line);
    }

    // --- history ---
    function saveState() {
      const snap = JSON.stringify(points);
      history = history.slice(0, historyIndex + 1);
      history.push(snap);
      if (history.length > MAX_HISTORY) history.shift();
      historyIndex = history.length - 1;
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        points = JSON.parse(history[historyIndex]);
        updatePath();
      }
    }

    function redo() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        points = JSON.parse(history[historyIndex]);
        updatePath();
      }
    }

    // --- add point ---
    function addPoint(e) {
      const pt = getCanvasPoint(e);
      const cmd = cmdSelect.value;
      if (cmd === 'Z') {
        // close path: add Z point
        points.push({ cmd: 'Z', x: pt.x, y: pt.y });
        saveState();
        updatePath();
        return;
      }

      const newPoint = { x: pt.x, y: pt.y, cmd: cmd };
      if (cmd === 'C') {
        newPoint.cp1x = pt.x - 20; newPoint.cp1y = pt.y - 20;
        newPoint.cp2x = pt.x + 20; newPoint.cp2y = pt.y + 20;
      } else if (cmd === 'Q') {
        newPoint.cp1x = pt.x - 20; newPoint.cp1y = pt.y - 20;
      } else if (cmd === 'A') {
        newPoint.rx = 30; newPoint.ry = 20; newPoint.xAxisRot = 0; newPoint.largeArc = 0; newPoint.sweep = 1;
      }
      points.push(newPoint);
      saveState();
      updatePath();
    }

    // --- drag control points ---
    let dragging = null; // { index, type, startX, startY, origPoint }

    function startDrag(e) {
      const target = e.target.closest('circle, g');
      if (!target) return;
      let index, type;
      if (target.tagName === 'circle' && target.parentElement?.dataset?.handle) {
        const g = target.parentElement;
        index = parseInt(g.dataset.index);
        type = g.dataset.handle;
      } else if (target.dataset?.index !== undefined && target.tagName === 'circle') {
        // main point drag
        index = parseInt(target.dataset.index);
        type = 'point';
      } else {
        return;
      }
      const pt = getCanvasPoint(e);
      dragging = {
        index,
        type,
        startX: pt.x,
        startY: pt.y,
        origPoint: JSON.parse(JSON.stringify(points[index]))
      };
      e.preventDefault();
    }

    function moveDrag(e) {
      if (!dragging) return;
      const pt = getCanvasPoint(e);
      const dx = pt.x - dragging.startX;
      const dy = pt.y - dragging.startY;
      const idx = dragging.index;
      const p = points[idx];
      if (!p) return;
      const orig = dragging.origPoint;

      if (dragging.type === 'point') {
        p.x = orig.x + dx;
        p.y = orig.y + dy;
        // also move control points relative?
        if (p.cmd === 'C') {
          p.cp1x = (orig.cp1x ?? orig.x) + dx;
          p.cp1y = (orig.cp1y ?? orig.y) + dy;
          p.cp2x = (orig.cp2x ?? orig.x) + dx;
          p.cp2y = (orig.cp2y ?? orig.y) + dy;
        } else if (p.cmd === 'Q') {
          p.cp1x = (orig.cp1x ?? orig.x) + dx;
          p.cp1y = (orig.cp1y ?? orig.y) + dy;
        }
      } else if (dragging.type === 'cp1') {
        p.cp1x = (orig.cp1x ?? orig.x) + dx;
        p.cp1y = (orig.cp1y ?? orig.y) + dy;
      } else if (dragging.type === 'cp2') {
        p.cp2x = (orig.cp2x ?? orig.x) + dx;
        p.cp2y = (orig.cp2y ?? orig.y) + dy;
      }
      updatePath();
      e.preventDefault();
    }

    function endDrag(e) {
      if (dragging) {
        // save history after drag
        saveState();
        dragging = null;
      }
    }

    // --- presets ---
    function loadPreset(name) {
      let newPoints = [];
      switch(name) {
        case 'star': {
          const cx=300, cy=200, r=80, n=5;
          for(let i=0; i<2*n; i++) {
            const angle = (i * Math.PI / n) - Math.PI/2;
            const rad = i%2===0 ? r : r*0.45;
            const x = cx + rad*Math.cos(angle);
            const y = cy + rad*Math.sin(angle);
            newPoints.push({ x, y, cmd: i===0 ? 'M' : 'L' });
          }
          newPoints.push({ cmd: 'Z', x:0, y:0 });
          break;
        }
        case 'heart': {
          newPoints = [
            {x:300, y:280, cmd:'M'},
            {x:300, y:280, cmd:'C', cp1x:200, cp1y:180, cp2x:160, cp2y:260},
            {x:300, y:280, cmd:'C', cp1x:440, cp1y:260, cp2x:400, cp2y:180},
          ];
          break;
        }
        case 'arrow': {
          newPoints = [
            {x:100, y:200, cmd:'M'}, {x:450, y:200, cmd:'L'},
            {x:380, y:140, cmd:'L'}, {x:500, y:200, cmd:'M'},
            {x:380, y:260, cmd:'L'}
          ];
          break;
        }
        case 'check': {
          newPoints = [
            {x:120, y:220, cmd:'M'}, {x:240, y:300, cmd:'L'}, {x:480, y:120, cmd:'L'}
          ];
          break;
        }
        case 'speech': {
          newPoints = [
            {x:200, y:120, cmd:'M'}, {x:400, y:120, cmd:'C', cp1x:450, cp1y:120, cp2x:450, cp2y:200},
            {x:400, y:240, cmd:'C', cp1x:450, cp1y:240, cp2x:420, cp2y:280},
            {x:320, y:280, cmd:'L'}, {x:280, y:330, cmd:'L'}, {x:280, y:280, cmd:'L'},
            {x:200, y:280, cmd:'C', cp1x:150, cp1y:280, cp2x:150, cp2y:200},
            {x:200, y:120, cmd:'Z'}
          ];
          break;
        }
        default: return;
      }
      points = newPoints;
      saveState();
      updatePath();
    }

    // --- export ---
    function exportSVG() {
      const d = buildD();
      const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
        <rect width="600" height="400" fill="#0f172a"/>
        <path d="${d}" fill="${fillColorInput.value}" stroke="${strokeColorInput.value}" stroke-width="${strokeWidthInput.value}" stroke-linejoin="round"/>
      </svg>`;
      const blob = new Blob([svgContent], {type: 'image/svg+xml'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'path.svg'; a.click();
      URL.revokeObjectURL(url);
    }

    function copyPath() {
      const d = buildD();
      navigator.clipboard.writeText(d).then(() => {
        alert('Path d copied to clipboard!');
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = d; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        alert('Copied!');
      });
    }

    // --- init events ---
    canvas.addEventListener('click', addPoint);
    canvas.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', moveDrag);
    document.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', (e) => { startDrag(e); }, { passive: false });
    document.addEventListener('touchmove', (e) => { moveDrag(e); }, { passive: false });
    document.addEventListener('touchend', endDrag);

    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('redoBtn').addEventListener('click', redo);
    document.getElementById('clearBtn').addEventListener('click', () => { points = []; saveState(); updatePath(); });
    document.getElementById('exportBtn').addEventListener('click', exportSVG);
    document.getElementById('copyPathBtn').addEventListener('click', copyPath);

    // preset buttons
    document.querySelectorAll('[data-preset]').forEach(btn => {
      btn.addEventListener('click', () => loadPreset(btn.dataset.preset));
    });

    // live style update
    strokeColorInput.addEventListener('input', updatePath);
    strokeWidthInput.addEventListener('input', updatePath);
    fillColorInput.addEventListener('input', updatePath);

    // initial state
    saveState();
    updatePath();
    // load a demo star
    loadPreset('star');
  })();
