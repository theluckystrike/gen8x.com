<body>
    <div class="container">
        <header>
            <h1>Typography Scale Calculator</h1>
            <p class="subtitle">Generate modular type scales with fluid typography</p>
        </header>

        <div class="main-content">
            <div class="panel" style="max-height: fit-content;">
                <div class="panel-title">Settings</div>

                <div class="control-group">
                    <label>Base Font Size (px)</label>
                    <input type="number" id="baseSize" value="16" min="10" max="24">
                </div>

                <div class="control-group">
                    <label>Scale Ratio</label>
                    <select id="scaleRatio">
                        <option value="1.067">Minor Second (1.067)</option>
                        <option value="1.125">Major Second (1.125)</option>
                        <option value="1.2">Minor Third (1.2)</option>
                        <option value="1.25">Major Third (1.25)</option>
                        <option value="1.333">Perfect Fourth (1.333)</option>
                        <option value="1.414">Augmented Fourth (1.414)</option>
                        <option value="1.5">Perfect Fifth (1.5)</option>
                        <option value="1.618">Golden Ratio (1.618)</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>

                <div class="control-group" id="customRatioGroup" style="display: none;">
                    <label>Custom Ratio</label>
                    <input type="number" id="customRatio" value="1.5" step="0.01" min="1">
                </div>

                <div class="control-row">
                    <div class="control-group">
                        <label>Steps Up</label>
                        <input type="number" id="stepsUp" value="6" min="1" max="10">
                    </div>
                    <div class="control-group">
                        <label>Steps Down</label>
                        <input type="number" id="stepsDown" value="2" min="1" max="5">
                    </div>
                </div>

                <div class="control-group">
                    <label>Line Height Multiplier</label>
                    <input type="number" id="lineHeight" value="1.5" step="0.1" min="1" max="2">
                </div>

                <div class="control-group">
                    <label>Font Family</label>
                    <input type="text" id="fontFamily" value="Georgia, serif">
                </div>

                <button onclick="generateScale()">Generate Scale</button>
            </div>

            <div class="panel">
                <div class="panel-title">Type Scale</div>

                <table class="scale-table" id="scaleTable">
                    <thead>
                        <tr>
                            <th>Step</th>
                            <th>px</th>
                            <th>rem</th>
                            <th>em</th>
                            <th>Line Height</th>
                        </tr>
                    </thead>
                    <tbody id="scaleRows"></tbody>
                </table>

                <div class="section-title">Live Preview</div>
                <div class="preview-section" id="previewSection"></div>

                <div class="section-title">CSS Output</div>
                <div class="code-output" id="codeOutput"></div>

                <button class="secondary-btn" onclick="copyCSSCode()">Copy CSS Code</button>
            </div>
        </div>
    </div>

    <script>
        const scaleRatioSelect = document.getElementById('scaleRatio');
        const customRatioGroup = document.getElementById('customRatioGroup');

        scaleRatioSelect.addEventListener('change', function() {
            customRatioGroup.style.display = this.value === 'custom' ? 'block' : 'none';
            generateScale();
        });

        function generateScale() {
            const baseSize = parseInt(document.getElementById('baseSize').value);
            const stepsUp = parseInt(document.getElementById('stepsUp').value);
            const stepsDown = parseInt(document.getElementById('stepsDown').value);
            const lineHeightMult = parseFloat(document.getElementById('lineHeight').value);
            const fontFamily = document.getElementById('fontFamily').value;

            let ratio = parseFloat(document.getElementById('scaleRatio').value);
            if (scaleRatioSelect.value === 'custom') {
                ratio = parseFloat(document.getElementById('customRatio').value);
            }

            const scale = [];

            // Generate down
            for (let i = stepsDown; i > 0; i--) {
                const size = baseSize / Math.pow(ratio, i);
                scale.push({
                    step: -i,
                    name: `xs${i}`,
                    px: Math.round(size * 100) / 100,
                    ratio: ratio
                });
            }

            // Base
            scale.push({
                step: 0,
                name: 'body',
                px: baseSize,
                ratio: ratio
            });

            // Generate up (h6, h5, h4, h3, h2, h1)
            const headingNames = ['h6', 'h5', 'h4', 'h3', 'h2', 'h1'];
            for (let i = 1; i <= stepsUp; i++) {
                const size = baseSize * Math.pow(ratio, i);
                scale.push({
                    step: i,
                    name: headingNames[Math.min(i - 1, headingNames.length - 1)],
                    px: Math.round(size * 100) / 100,
                    ratio: ratio
                });
            }

            // Update table
            const scaleRows = document.getElementById('scaleRows');
            scaleRows.innerHTML = '';

            scale.forEach(item => {
                const rem = (item.px / 16).toFixed(3);
                const em = (item.px / baseSize).toFixed(3);
                const lh = (item.px * lineHeightMult / 16).toFixed(3);

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.name}</strong></td>
                    <td>${item.px}</td>
                    <td>${rem}</td>
                    <td>${em}</td>
                    <td>${lh}rem (${Math.round(lineHeightMult * 100)}%)</td>
                `;
                scaleRows.appendChild(row);
            });

            // Update preview
            const previewSection = document.getElementById('previewSection');
            previewSection.innerHTML = '';
            previewSection.style.fontFamily = fontFamily;

            scale.slice(-6).reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `
                    <div class="preview-label">${item.name} / ${item.px}px / ${(item.px / 16).toFixed(3)}rem</div>
                    <div class="preview-text" style="font-size: ${item.px}px; line-height: ${lineHeightMult};">
                        The quick brown fox jumps over the lazy dog
                    </div>
                `;
                previewSection.appendChild(div);
            });

            // Generate CSS
            generateCSS(scale, baseSize, lineHeightMult, fontFamily);
        }

        function generateCSS(scale, baseSize, lineHeightMult, fontFamily) {
            let css = `:root {
  --font-family: "${fontFamily}";
  --base-font-size: ${baseSize}px;
  --line-height-multiplier: ${lineHeightMult};
`;

            scale.forEach(item => {
                const rem = (item.px / 16).toFixed(3);
                css += `  --size-${item.name}: ${rem}rem; /* ${item.px}px */\n`;
            });

            css += `}\n\nbody {
  font-family: var(--font-family);
  font-size: var(--size-body);
  line-height: var(--line-height-multiplier);
}\n\n`;

            // Generate heading styles
            const headings = ['h1', 'h2', 'h3', 'h4', 'h5', 'h6'];
            headings.forEach(h => {
                css += `${h} {
  font-size: var(--size-${h});
  line-height: calc(var(--size-${h}) * var(--line-height-multiplier));
  margin-bottom: 1rem;
}\n\n`;
            });

            document.getElementById('codeOutput').textContent = css.trim();
        }

        function copyCSSCode() {
            const code = document.getElementById('codeOutput').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        // Add event listeners
        document.getElementById('baseSize').addEventListener('change', generateScale);
        document.getElementById('stepsUp').addEventListener('change', generateScale);
        document.getElementById('stepsDown').addEventListener('change', generateScale);
        document.getElementById('lineHeight').addEventListener('input', generateScale);
        document.getElementById('fontFamily').addEventListener('change', generateScale);
        document.getElementById('customRatio').addEventListener('input', generateScale);

        generateScale();
    </script>
</body>
