<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Flexbox Playground — Interactive CSS Flex Layout Builder</title>
  <meta name="description" content="Interactive Flexbox layout builder: adjust container & item properties, see real-time preview, copy CSS, and solve 5 layout puzzles. Dark theme...">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://gen8x.com/tools/flexbox-playground">
  <!-- JSON-LD FAQ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {"@type":"Question","name":"What is Flexbox?","acceptedAnswer":{"@type":"Answer","text":"Flexbox is a one-dimensional CSS layout method for arranging items in rows or columns with flexible sizing."}},
      {"@type":"Question","name":"How do I reset the playground?","acceptedAnswer":{"@type":"Answer","text":"Use the 'Reset to defaults' button to restore container and items to initial values."}},
      {"@type":"Question","name":"Can I copy the generated CSS?","acceptedAnswer":{"@type":"Answer","text":"Yes, the CSS code panel shows live code; you can select and copy it."}},
      {"@type":"Question","name":"What are the challenge puzzles?","acceptedAnswer":{"@type":"Answer","text":"There are 5 predefined layout targets. Try to match the preview by adjusting properties; a success message appears when you match."}}
    ]
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1280px;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      color: #f1f5f9;
    }
    .subhead {
      color: #94a3b8;
      margin-bottom: 2rem;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 800px) {
      .grid-2col {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }
    .card {
      background: #1e293b;
      border-radius: 1rem;
      padding: 1.25rem 1.25rem 1.5rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .card h2 {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 1rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.2rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    .control-group label {
      display: flex;
      flex-direction: column;
      font-size: 0.8rem;
      color: #94a3b8;
      gap: 0.2rem;
    }
    select, input[type="number"], input[type="range"] {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.4rem 0.6rem;
      font-size: 0.9rem;
      min-width: 80px;
    }
    select:focus, input:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }
    input[type="number"] {
      width: 70px;
    }
    .item-props-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.5rem 1rem;
      background: #0f172a;
      padding: 0.8rem;
      border-radius: 0.8rem;
      margin-top: 0.5rem;
    }
    .item-props-grid label {
      flex-direction: row;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
    }
    .item-props-grid input, .item-props-grid select {
      min-width: 50px;
      width: auto;
      flex: 1;
    }
    .preview-box {
      background: #0f172a;
      border-radius: 1rem;
      padding: 1rem;
      min-height: 200px;
      border: 1px solid #1e293b;
      transition: all 0.2s;
    }
    .flex-preview {
      display: flex;
      min-height: 160px;
      background: #0f172a;
      border-radius: 0.6rem;
      padding: 0.5rem;
      gap: 0.4rem;
      transition: all 0.2s;
      flex-wrap: nowrap;
    }
    .flex-item {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.4rem;
      padding: 0.2rem 0.1rem;
      min-width: 30px;
      font-size: 0.9rem;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(56,189,248,0.3);
    }
    .flex-item:nth-child(odd) {
      background: #f472b6;
    }
    .flex-item:nth-child(3n) {
      background: #a78bfa;
    }
    .code-panel {
      background: #0f172a;
      border-radius: 0.6rem;
      padding: 0.8rem 1rem;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #1e293b;
      color: #cbd5e1;
      max-height: 180px;
      overflow-y: auto;
    }
    .btn {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      font-weight: 600;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 2px 6px rgba(56,189,248,0.3);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #38bdf8;
      color: #38bdf8;
    }
    .btn:hover {
      filter: brightness(1.1);
      transform: scale(0.97);
    }
    .challenge-area {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #1e293b;
    }
    .challenge-badge {
      background: #2d3a5e;
      padding: 0.2rem 0.8rem;
      border-radius: 1rem;
      color: #b9d4f0;
      font-size: 0.7rem;
    }
    .footer {
      margin-top: 3rem;
      text-align: center;
      color: #475569;
      font-size: 0.85rem;
      border-top: 1px solid #1e293b;
      padding-top: 1.5rem;
    }
    .success-msg {
      background: #14532d;
      color: #bbf7d0;
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      display: inline-block;
      font-size: 0.8rem;
    }
    .flex-wrap-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
    }
    .mt-1 { margin-top: 0.5rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .gap-1 { gap: 0.5rem; }
  </style>

    <meta property="og:title" content="Flexbox Playground — Interactive CSS Flex Layout Builder">
    <meta property="og:description" content="Interactive Flexbox layout builder: adjust container & item properties, see real-time preview, copy CSS, and solve 5 layout puzzles. Dark theme...">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gen8x.com/tools/flexbox-playground">
</head>
<body>
<div class="container">
  <header>
    <h1>🧱 Flexbox Playground</h1>
    <div class="subhead">
      <span>Interactive CSS Flex Layout Builder — gen8x.com</span>
      <span class="challenge-badge" id="challengeLabel">Free mode</span>
    </div>
  </header>

  <div class="grid-2col">
    <!-- LEFT: Controls -->
    <div class="card">
      <h2>🎛️ Container</h2>
      <div class="control-group">
        <label>flex-direction
          <select id="fd">
            <option value="row">row</option>
            <option value="row-reverse">row-reverse</option>
            <option value="column">column</option>
            <option value="column-reverse">column-reverse</option>
          </select>
        </label>
        <label>justify-content
          <select id="jc">
            <option value="flex-start">flex-start</option>
            <option value="flex-end">flex-end</option>
            <option value="center">center</option>
            <option value="space-between">space-between</option>
            <option value="space-around">space-around</option>
            <option value="space-evenly">space-evenly</option>
          </select>
        </label>
        <label>align-items
          <select id="ai">
            <option value="stretch">stretch</option>
            <option value="flex-start">flex-start</option>
            <option value="flex-end">flex-end</option>
            <option value="center">center</option>
            <option value="baseline">baseline</option>
          </select>
        </label>
        <label>flex-wrap
          <select id="fw">
            <option value="nowrap">nowrap</option>
            <option value="wrap">wrap</option>
            <option value="wrap-reverse">wrap-reverse</option>
          </select>
        </label>
        <label>gap
          <input type="number" id="gapVal" value="8" min="0" max="40" step="1"> px
        </label>
      </div>

      <div class="flex-wrap-row">
        <span style="color:#94a3b8;font-size:0.9rem;">Items: <span id="itemCountDisplay">4</span></span>
        <button class="btn btn-outline" id="addItemBtn" style="padding:0.2rem 1rem;">+ Add</button>
        <button class="btn btn-outline" id="removeItemBtn" style="padding:0.2rem 1rem;">− Remove</button>
        <button class="btn" id="resetBtn">↺ Reset</button>
      </div>

      <h2 style="margin-top:1.2rem;">🧩 Per‑item properties</h2>
      <div id="itemPropsContainer" class="item-props-grid">
        <!-- dynamic per-item controls -->
      </div>
      <p style="font-size:0.7rem;color:#64748b;margin-top:0.3rem;">Select item above, then adjust values.</p>
    </div>

    <!-- RIGHT: Preview + CSS -->
    <div class="card">
      <h2>👁️ Live preview</h2>
      <div class="preview-box">
        <div id="flexContainer" class="flex-preview">
          <!-- items injected -->
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:0.5rem 0 0.2rem;">
        <span style="color:#94a3b8;font-size:0.8rem;">CSS code</span>
        <span id="matchIndicator" style="font-size:0.8rem;"></span>
      </div>
      <div id="cssCode" class="code-panel">/* flex container */<br>/* items */</div>
    </div>
  </div>

  <!-- Challenge mode -->
  <div class="challenge-area">
    <div style="display:flex;flex-wrap:wrap;gap:0.8rem;align-items:center;">
      <span style="font-weight:500;">🎯 Challenge: Match this layout</span>
      <div id="challengeBtns">
        <button class="btn btn-outline" data-challenge="1">Puzzle 1</button>
        <button class="btn btn-outline" data-challenge="2">Puzzle 2</button>
        <button class="btn btn-outline" data-challenge="3">Puzzle 3</button>
        <button class="btn btn-outline" data-challenge="4">Puzzle 4</button>
        <button class="btn btn-outline" data-challenge="5">Puzzle 5</button>
      </div>
      <button id="exitChallengeBtn" class="btn btn-outline" style="border-color:#f472b6;color:#f472b6;">Exit challenge</button>
    </div>
    <div id="challengeMessage" style="margin-top:0.5rem;min-height:1.5rem;"></div>
  </div>

  <footer class="footer">© 2025 gen8x.com</footer>
</div>

<script>
  (function() {
    // ----- STATE -----
    const state = {
      items: [], // array of item objects: {grow, shrink, basis, order, alignSelf}
      selectedIndex: 0,
      challengeMode: null, // null or challenge config
    };

    // DOM refs
    const containerEl = document.getElementById('flexContainer');
    const cssCodeEl = document.getElementById('cssCode');
    const itemCountDisplay = document.getElementById('itemCountDisplay');
    const itemPropsContainer = document.getElementById('itemPropsContainer');
    const matchIndicator = document.getElementById('matchIndicator');
    const challengeMessage = document.getElementById('challengeMessage');
    const challengeLabel = document.getElementById('challengeLabel');

    // container controls
    const fd = document.getElementById('fd');
    const jc = document.getElementById('jc');
    const ai = document.getElementById('ai');
    const fw = document.getElementById('fw');
    const gapVal = document.getElementById('gapVal');

    // buttons
    const addBtn = document.getElementById('addItemBtn');
    const removeBtn = document.getElementById('removeItemBtn');
    const resetBtn = document.getElementById('resetBtn');
    const exitChallengeBtn = document.getElementById('exitChallengeBtn');

    // ----- helpers -----
    function defaultItem() {
      return { grow: 0, shrink: 1, basis: 'auto', order: 0, alignSelf: 'auto' };
    }

    function resetState() {
      state.items = [];
      for (let i = 0; i < 4; i++) state.items.push(defaultItem());
      state.selectedIndex = 0;
      state.challengeMode = null;
      // reset controls
      fd.value = 'row';
      jc.value = 'flex-start';
      ai.value = 'stretch';
      fw.value = 'nowrap';
      gapVal.value = 8;
      challengeLabel.textContent = 'Free mode';
      challengeMessage.innerHTML = '';
      matchIndicator.textContent = '';
    }
    resetState();

    // ----- render items & preview -----
    function renderPreview() {
      const items = state.items;
      // update container styles
      containerEl.style.flexDirection = fd.value;
      containerEl.style.justifyContent = jc.value;
      containerEl.style.alignItems = ai.value;
      containerEl.style.flexWrap = fw.value;
      containerEl.style.gap = gapVal.value + 'px';

      // rebuild children
      containerEl.innerHTML = '';
      items.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'flex-item';
        div.textContent = idx + 1;
        div.dataset.index = idx;
        // apply per-item styles
        div.style.flexGrow = item.grow;
        div.style.flexShrink = item.shrink;
        div.style.flexBasis = (item.basis === 'auto' ? 'auto' : item.basis + 'px');
        div.style.order = item.order;
        if (item.alignSelf !== 'auto') {
          div.style.alignSelf = item.alignSelf;
        } else {
          div.style.alignSelf = '';
        }
        // highlight selected
        if (idx === state.selectedIndex) {
          div.style.outline = '2px solid #facc15';
          div.style.outlineOffset = '2px';
        } else {
          div.style.outline = '';
        }
        // click to select
        div.addEventListener('click', (e) => {
          state.selectedIndex = idx;
          renderPreview();
          renderItemProps();
        });
        containerEl.appendChild(div);
      });
      itemCountDisplay.textContent = items.length;
      generateCSS();
      checkChallengeMatch();
    }

    // ----- per-item controls -----
    function renderItemProps() {
      const items = state.items;
      if (items.length === 0) {
        itemPropsContainer.innerHTML = '<span style="color:#94a3b8;">No items</span>';
        return;
      }
      const idx = state.selectedIndex;
      const item = items[idx] || items[0];
      // ensure selectedIndex valid
      if (!items[state.selectedIndex]) state.selectedIndex = 0;
      const safeItem = items[state.selectedIndex] || items[0];

      let html = `<div style="grid-column:1/-1;color:#94a3b8;font-size:0.75rem;">Editing item #${state.selectedIndex+1}</div>`;
      const fields = [
        { label: 'flex-grow', key: 'grow', type: 'number', min: 0, max: 10, step: 0.1 },
        { label: 'flex-shrink', key: 'shrink', type: 'number', min: 0, max: 10, step: 0.1 },
        { label: 'flex-basis', key: 'basis', type: 'text', placeholder: 'auto or px' },
        { label: 'order', key: 'order', type: 'number', min: -10, max: 10, step: 1 },
        { label: 'align-self', key: 'alignSelf', type: 'select', options: ['auto','flex-start','flex-end','center','baseline','stretch'] }
      ];
      fields.forEach(f => {
        let value = safeItem[f.key];
        if (f.key === 'basis' && value === 'auto') value = 'auto';
        if (f.type === 'select') {
          html += `<label>${f.label} <select data-key="${f.key}">`;
          f.options.forEach(opt => {
            html += `<option value="${opt}" ${value===opt?'selected':''}>${opt}</option>`;
          });
          html += `</select></label>`;
        } else if (f.type === 'text') {
          html += `<label>${f.label} <input type="text" data-key="${f.key}" value="${value}" placeholder="auto"></label>`;
        } else {
          html += `<label>${f.label} <input type="number" data-key="${f.key}" value="${value}" min="${f.min}" max="${f.max}" step="${f.step}"></label>`;
        }
      });
      itemPropsContainer.innerHTML = html;

      // attach events
      itemPropsContainer.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('change', function(e) {
          const key = this.dataset.key;
          let val = this.value;
          if (key === 'grow' || key === 'shrink' || key === 'order') val = parseFloat(val) || 0;
          if (key === 'basis') { if (val === 'auto' || val === '') val = 'auto'; else { let p = parseInt(val); if (!isNaN(p)) val = p; else val = 'auto'; } }
          // update item
          const idx = state.selectedIndex;
          if (state.items[idx]) {
            state.items[idx][key] = val;
            renderPreview();
          }
        });
      });
    }

    // ----- generate CSS -----
    function generateCSS() {
      const containerRules = `display: flex;\nflex-direction: ${fd.value};\njustify-content: ${jc.value};\nalign-items: ${ai.value};\nflex-wrap: ${fw.value};\ngap: ${gapVal.value}px;`;
      let itemsCSS = '';
      state.items.forEach((item, i) => {
        itemsCSS += `\n/* item ${i+1} */\nflex: ${item.grow} ${item.shrink} ${item.basis === 'auto' ? 'auto' : item.basis+'px'};\norder: ${item.order};\nalign-self: ${item.alignSelf};`;
      });
      cssCodeEl.textContent = `/* flex container */\n${containerRules}\n\n/* items */${itemsCSS}`;
    }

    // ----- challenge system -----
    const challenges = [
      { fd:'row', jc:'center', ai:'center', fw:'nowrap', gap:12, items:[{grow:1,shrink:1,basis:'auto',order:0,alignSelf:'auto'},{grow:2,shrink:1,basis:'auto',order:0,alignSelf:'auto'},{grow:1,shrink:1,basis:'auto',order:0,alignSelf:'auto'}] },
      { fd:'column', jc:'space-between', ai:'stretch', fw:'nowrap', gap:8, items:[{grow:0,shrink:1,basis:'80px',order:0,alignSelf:'auto'},{grow:0,shrink:1,basis:'80px',order:0,alignSelf:'auto'},{grow:0,shrink:1,basis:'80px',order:0,alignSelf:'auto'}] },
      { fd:'row-reverse', jc:'flex-end', ai:'flex-start', fw:'wrap', gap:16, items:[{grow:0,shrink:1,basis:'100px',order:0,alignSelf:'auto'},{grow:0,shrink:1,basis:'100px',order:0,alignSelf:'auto'},{grow:0,shrink:1,basis:'100px',order:0,alignSelf:'auto'},{grow:0,shrink:1,basis:'100px',order:0,alignSelf:'auto'}] },
      { fd:'row', jc:'center', ai:'baseline', fw:'nowrap', gap:6, items:[{grow:1,shrink:0,basis:'60px',order:0,alignSelf:'auto'},{grow:2,shrink:0,basis:'60px',order:0,alignSelf:'flex-end'},{grow:1,shrink:0,basis:'60px',order:0,alignSelf:'auto'}] },
      { fd:'column-reverse', jc:'space-evenly', ai:'flex-end', fw:'nowrap', gap:10, items:[{grow:0,shrink:1,basis:'50px',order:0,alignSelf:'auto'},{grow:0,shrink:1,basis:'50px',order:2,alignSelf:'auto'},{grow:0,shrink:1,basis:'50px',order:1,alignSelf:'auto'}] }
    ];

    function loadChallenge(index) {
      const c = challenges[index];
      if (!c) return;
      state.challengeMode = c;
      challengeLabel.textContent = `Puzzle ${index+1}`;
      // apply to controls
      fd.value = c.fd;
      jc.value = c.jc;
      ai.value = c.ai;
      fw.value = c.fw;
      gapVal.value = c.gap;
      // set items
      state.items = c.items.map(it => ({...it}));
      state.selectedIndex = 0;
      renderPreview();
      renderItemProps();
      challengeMessage.innerHTML = '🎯 Match the target layout! Adjust properties.';
    }

    function checkChallengeMatch() {
      if (!state.challengeMode) {
        matchIndicator.textContent = '';
        return;
      }
      const c = state.challengeMode;
      let match = true;
      if (fd.value !== c.fd || jc.value !== c.jc || ai.value !== c.ai || fw.value !== c.fw || parseInt(gapVal.value) !== c.gap) match = false;
      if (state.items.length !== c.items.length) match = false;
      if (match) {
        for (let i=0; i<state.items.length; i++) {
          const a = state.items[i], b = c.items[i];
          if (a.grow !== b.grow || a.shrink !== b.shrink || a.basis !== b.basis || a.order !== b.order || a.alignSelf !== b.alignSelf) { match = false; break; }
        }
      }
      if (match) {
        matchIndicator.innerHTML = '<span class="success-msg">✅ Layout matched!</span>';
        challengeMessage.innerHTML = '🎉 Perfect! You solved the puzzle.';
      } else {
        matchIndicator.textContent = '❌ Not yet matched';
        challengeMessage.innerHTML = 'Keep trying — adjust container & item properties.';
      }
    }

    // ----- event listeners -----
    [fd, jc, ai, fw, gapVal].forEach(el => el.addEventListener('change', () => { renderPreview(); renderItemProps(); }));
    gapVal.addEventListener('input', function() { renderPreview(); });

    addBtn.addEventListener('click', () => {
      if (state.items.length >= 12) return;
      state.items.push(defaultItem());
      state.selectedIndex = state.items.length - 1;
      renderPreview();
      renderItemProps();
    });
    removeBtn.addEventListener('click', () => {
      if (state.items.length <= 1) return;
      state.items.pop();
      if (state.selectedIndex >= state.items.length) state.selectedIndex = state.items.length - 1;
      renderPreview();
      renderItemProps();
    });
    resetBtn.addEventListener('click', () => {
      resetState();
      renderPreview();
      renderItemProps();
      challengeMessage.innerHTML = '';
      matchIndicator.textContent = '';
    });

    // challenge buttons
    document.querySelectorAll('[data-challenge]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(e.target.dataset.challenge) - 1;
        loadChallenge(idx);
      });
    });
    exitChallengeBtn.addEventListener('click', () => {
      state.challengeMode = null;
      challengeLabel.textContent = 'Free mode';
      challengeMessage.innerHTML = '';
      matchIndicator.textContent = '';
      // keep current settings but mark free
      renderPreview();
    });

    // initial render
    renderPreview();
    renderItemProps();
  })();
</script>
</body>
</html>
