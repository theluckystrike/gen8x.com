<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator | gen8x.com</title>
  <meta name="description" content="Generate harmonious color palettes with hex, RGB, and HSL values. Export as CSS variables, Tailwind, SCSS, or JSON. Free client-side tool.">
  <meta name="keywords" content="color palette generator, color scheme tool, CSS colors, complementary colors, web design colors">
  <link rel="canonical" href="https://gen8x.com/">
  <meta property="og:title" content="Color Palette Generator | gen8x.com">
  <meta property="og:description" content="Generate harmonious color palettes. Export as CSS variables, Tailwind config, SCSS, or JSON.">
  <meta property="og:url" content="https://gen8x.com/">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="/" class="logo">gen8x</a>
      <nav>
        <a href="/">Tool</a>
        <a href="/blog/">Blog</a>
        <a href="/about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Color <span>Palette</span> Generator</h1>
      <p>Generate harmonious 5-color palettes. Click any swatch to copy its hex code.</p>
    </section>

    <div class="controls">
      <div class="control-row">
        <button class="btn" onclick="gen8x.generateRandom()">Random Palette</button>
        <div class="control-group">
          <label>From Hex</label>
          <div style="display:flex;gap:8px;">
            <input type="text" id="hex-input" placeholder="#3B82F6">
            <button class="btn" onclick="gen8x.generateFromHex()">Go</button>
          </div>
        </div>
        <div class="control-group">
          <label>From Keyword</label>
          <div style="display:flex;gap:8px;">
            <input type="text" id="keyword-input" placeholder="ocean, sunset...">
            <button class="btn" onclick="gen8x.generateFromKeyword()">Go</button>
          </div>
        </div>
      </div>
      <div class="control-row">
        <div class="control-group">
          <label>Palette Type</label>
          <div class="radio-group">
            <input type="radio" name="palette-type" id="pt-comp" value="complementary" checked>
            <label for="pt-comp">Complementary</label>
            <input type="radio" name="palette-type" id="pt-analog" value="analogous">
            <label for="pt-analog">Analogous</label>
            <input type="radio" name="palette-type" id="pt-triad" value="triadic">
            <label for="pt-triad">Triadic</label>
            <input type="radio" name="palette-type" id="pt-mono" value="monochromatic">
            <label for="pt-mono">Monochromatic</label>
          </div>
        </div>
      </div>
    </div>

    <div id="palette-display" class="palette-display"></div>

    <div class="preview-mockup">
      <h3>Live Preview</h3>
      <div id="mockup-frame" class="mockup-frame"></div>
    </div>

    <div class="export-section">
      <div class="export-tabs">
        <button class="export-tab active" onclick="gen8x.switchExportTab('css', this)">CSS Variables</button>
        <button class="export-tab" onclick="gen8x.switchExportTab('tailwind', this)">Tailwind</button>
        <button class="export-tab" onclick="gen8x.switchExportTab('scss', this)">SCSS</button>
        <button class="export-tab" onclick="gen8x.switchExportTab('json', this)">JSON</button>
      </div>
      <div id="export-code" class="export-code"></div>
    </div>

    <div class="history-section">
      <h3>Recent Palettes</h3>
      <div id="history-list" class="history-list"></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <footer>
    <div class="container">
      <span>Built by <a href="https://zovo.one">zovo.one</a> &middot; More tools: <a href="https://krzen.com">krzen.com</a>, <a href="https://abwex.com">abwex.com</a></span>
      <span>&copy; 2025 gen8x.com</span>
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
